# The httpd lines for pond_node (docs/store.md). httpd speaks FastCGI to it
# on 127.0.0.1 port 8788.
#
# Shadow mode (phase 2): a second server, on 127.0.0.1 only, for
# pond_shadow bench through httpd. The public server keeps slowcgi and
# pond_read for these paths.
server "pond-node-shadow" {
	listen on 127.0.0.1 port 8789
	location "/pond/entries.json" { fastcgi socket tcp 127.0.0.1 8788 }
	location "/log" { fastcgi socket tcp 127.0.0.1 8788 }
	location "/log/" { fastcgi socket tcp 127.0.0.1 8788 }
	location "/log/feed.xml" { fastcgi socket tcp 127.0.0.1 8788 }
}

# The switch (phase 5): the same four location lines go in the public
# server in place of its slowcgi lines for pond_read.
